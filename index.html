<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

   
    <style>
      @font-face {
        font-family: "Figtree";
        src: url("./assets/fonts/Figtree-VariableFont_wght.ttf");
        font-weight: 500 800;
      }
      @media (min-width: 600px) {
        h1 {
          font-size: x-large;
          font-weight: 800;
        }

        .description {
          font-size: medium;
        }
      }
      
      body {
        font-family: "Figtree", sans-serif;
        background-color: hsl(47, 88%, 63%);
      }
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      .card {
        max-width: 300px;
        position:absolute;
        top: 50%;
        left:50%;
        border: 1px solid hsl(0, 0%, 7%);
        background: white;
        padding: 30px 30px;
        border-radius: 20px;
        box-shadow: 10px 10px 0px 0px hsl(0, 0%, 7%);

        transform: translate(-50%,-50%);

        img {
          width: 100%;
          border-radius: 10px;
        }
        .tag {
          background-color: hsl(47, 88%, 63%);
          display:inline-block;
          height: auto;
          border-radius: 4px;
          margin-top: 16px;
          

          padding: 5px 10px;

          p {
            margin: auto;
            font-weight: bold;
          }
        }

        .profile {
          display: flex;
          height: auto;
          align-items: center;
          justify-content: start;
          gap: 10px;
          p {
            margin: 0;
            font-weight: bolder;
          }
          img{
            height: 32px;
            width: 32px;
          }
        }

      }

      @media (max-width: 599px){

        .card {
          width: 70vw;
          padding: 20px 20px;
        }
        h1 {
          font-size: larger;
        }
        p {
          font-size: small;
        }
        .profile {
          margin-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./assets/images/illustration-article.svg" alt="" />
      <div class="tag">
        <p>Learning</p>
      </div>
      <p>Published 21 Dec 2023</p>
      <h1>HTML & CSS foundations</h1>
      <p class="description">
        These languages are the backbone of every website, defining structure,
        content, and presentation. Greg Hooper
      </p>
      <div class="profile">
        <img src="assets/images/image-avatar.webp" alt="" srcset="">
        <p>Greg Hooper</p>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
